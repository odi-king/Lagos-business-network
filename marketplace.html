<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace - Lagos Business Network</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
    <div class="container">
        <a href="index.html" class="logo"><span class="logo-mark">L</span> Lagos Business Network</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="marketplace.html" class="active">Marketplace</a>
            <a href="#" id="logoutBtn">Log out</a>
        </div>
    </div>
</nav>

<main class="container">
    <div class="page-head">
        <h1>Business marketplace</h1>
        <p id="welcomeText">Register your business and find others to work with.</p>
    </div>

    <section class="panel">
        <h2>Register your business</h2>
        <form id="businessForm">
            <input type="text" id="businessName" placeholder="Business name" required>
            <select id="businessCategory" required>
                <option value="" disabled selected>Select category</option>
                <option value="Food">Food</option>
                <option value="Fashion">Fashion</option>
                <option value="Tech">Tech</option>
                <option value="Services">Services</option>
                <option value="Other">Other</option>
            </select>
            <input type="text" id="businessLocation" placeholder="Location (e.g. Ikeja)" required>
            <input type="tel" id="businessPhone" placeholder="Phone number" required>
            <input type="email" id="businessEmail" placeholder="Email address" required>
            <button type="submit" class="contact-btn">Register business</button>
        </form>
    </section>

    <section class="panel">
        <h2>Find a business</h2>
        <div class="filters">
            <input type="text" id="searchInput" placeholder="Search by name">
            <select id="categoryFilter">
                <option value="all">All</option>
                <option value="Food">Food</option>
                <option value="Fashion">Fashion</option>
                <option value="Tech">Tech</option>
                <option value="Services">Services</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div id="registeredBusinessList"></div>
    </section>
</main>

<footer class="footer">
    <div class="container">&copy; 2026 Lagos Business Network</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
