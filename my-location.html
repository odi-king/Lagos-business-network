<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My location - Lagos Business Network</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#0b1220">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LBN">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
.stream-card{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.live-dot{display:inline-block;background:#e03131;color:#fff;border-radius:6px;padding:1px 7px;font-size:.75rem;font-weight:700;margin-right:6px;}
</style>
</head>
<body>

<nav class="nav">
    <div class="container">
        <a href="index.html" class="logo"><span class="logo-mark">LBN</span><span class="logo-name">Lagos Business Network</span></a>
        <div class="nav-links">
            <a href="streams.html">Live streams</a>
        </div>
    </div>
</nav>

<main class="container">
    <div class="page-head">
        <h1>My location</h1>
        <p class="meta">Tell us where you are. This helps LBN show you the right payment method and prices for your country. Only the LBN team can see it.</p>
    </div>

    <section class="panel">
        <form id="locForm" autocomplete="off">
            <input type="text" id="country" list="countryList" placeholder="Country (type to search)" required>
            <datalist id="countryList"></datalist>
            <input type="text" id="stateBox" list="stateList" placeholder="State or region" maxlength="80">
            <datalist id="stateList"></datalist>
            <input type="text" id="city" placeholder="City or town" maxlength="80" required>
            <input type="text" id="orgName" placeholder="School or business name (optional)" maxlength="120">
            <button type="submit" class="contact-btn">Save my location</button>
        </form>
        <p id="locMsg" class="msg"></p>
    </section>
</main>

<footer class="footer">
    <div class="container">&copy; 2026 Lagos Business Network &bull; <a href="help.html" style="color: var(--accent);">Help</a> &bull; <a href="contact.html" style="color: var(--accent);">Contact us</a>
        <div class="legal-links"><a href="terms.html">Terms of Use</a> &bull; <a href="privacy.html">Privacy Policy</a> &bull; <a href="refunds.html">Refunds and Disputes</a></div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="countries.js"></script>
<script src="my-location.js"></script>
<script src="pwa.js"></script>
</body>
</html>
