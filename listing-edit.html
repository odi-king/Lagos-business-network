<main class="container">
    <a href="#" onclick="history.back(); return false;" class="plain-btn" style="display:inline-block; margin:14px 0 0; color: var(--accent);">&larr; Back</a>
    <div class="page-head">
        <h1>Photos and details</h1>
        <p class="meta" id="leTitle"></p>
    </div>
    <p id="leMsg" class="msg"></p>

    <section class="panel" id="leBox" style="display:none;">
        <h2>Category and place</h2>
        <select id="leCategory"><option value="">No category</option></select>
        <select id="leState"><option value="">State</option><option value="Abia">Abia</option><option value="Adamawa">Adamawa</option><option value="Akwa Ibom">Akwa Ibom</option><option value="Anambra">Anambra</option><option value="Bauchi">Bauchi</option><option value="Bayelsa">Bayelsa</option><option value="Benue">Benue</option><option value="Borno">Borno</option><option value="Cross River">Cross River</option><option value="Delta">Delta</option><option value="Ebonyi">Ebonyi</option><option value="Edo">Edo</option><option value="Ekiti">Ekiti</option><option value="Enugu">Enugu</option><option value="FCT Abuja">FCT Abuja</option><option value="Gombe">Gombe</option><option value="Imo">Imo</option><option value="Jigawa">Jigawa</option><option value="Kaduna">Kaduna</option><option value="Kano">Kano</option><option value="Katsina">Katsina</option><option value="Kebbi">Kebbi</option><option value="Kogi">Kogi</option><option value="Kwara">Kwara</option><option value="Lagos">Lagos</option><option value="Nasarawa">Nasarawa</option><option value="Niger">Niger</option><option value="Ogun">Ogun</option><option value="Ondo">Ondo</option><option value="Osun">Osun</option><option value="Oyo">Oyo</option><option value="Plateau">Plateau</option><option value="Rivers">Rivers</option><option value="Sokoto">Sokoto</option><option value="Taraba">Taraba</option><option value="Yobe">Yobe</option><option value="Zamfara">Zamfara</option><option value="Outside Nigeria">Outside Nigeria</option></select>
        <input type="text" id="leArea" maxlength="60" placeholder="Area or town, for example Yaba (optional)">

        <h2>Photos</h2>
        <p class="meta">Up to 6 photos in all. The first photo is the cover. Buyers swipe through the rest. Use clear, bright photos of the real item.</p>
        <div id="lePhotos" style="display:flex;flex-wrap:wrap;gap:10px;"></div>
        <input type="file" id="leFiles" accept="image/jpeg,image/png,image/webp,image/*" multiple style="display:none;">
        <p><button type="button" class="btn btn-outline" id="leAdd">Add photos</button></p>

        <p><button type="button" class="contact-btn" id="leSave">Save</button></p>
    </section>
</main>
