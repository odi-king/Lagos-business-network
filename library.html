<main class="container">
    <div class="page-head">
        <h1>Handouts and books</h1>
        <p>Learn from your lecturers' notes and books. Buy once, download anytime.</p>
    </div>

    <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="browse">Browse</button>
        <button type="button" class="tab-btn" data-tab="purchases">My purchases</button>
        <button type="button" class="tab-btn" data-tab="sales" id="salesTab" style="display:none;">My sales</button>
    </div>

    <section id="browsePane">
        <input type="text" id="searchBox" class="search-box" placeholder="Search by title or lecturer">
        <select id="kindFilter">
            <option value="">Handouts and books</option>
            <option value="handout">Handouts only</option>
            <option value="book">Books only</option>
        </select>
        <div id="browseList"></div>
    </section>

    <section id="purchasesPane" style="display:none;">
        <div id="purchasesList"></div>
    </section>

    <section id="salesPane" style="display:none;">
        <div id="salesSummary"></div>
        <div id="salesList"></div>
    </section>

    <p id="libNote" class="meta"></p>
