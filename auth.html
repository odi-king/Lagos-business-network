<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Lagos Business Network</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
    <div class="container">
        <a href="index.html" class="logo"><span class="logo-mark">L</span> Lagos Business Network</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </div>
</nav>

<main class="container auth-wrap">
    <section class="panel">
        <h2 id="authTitle">Log in</h2>

        <form id="authForm">
            <div id="signupFields" style="display:none; flex-direction:column; gap:10px;">
                <input type="text" id="fullName" placeholder="Full name">
                <select id="role">
                    <option value="student">I am a student or graduate</option>
                    <option value="lecturer">I am a lecturer</option>
                </select>
            </div>

            <input type="email" id="email" placeholder="Email address" required>
            <input type="password" id="password" placeholder="Password (at least 6 characters)" minlength="6" required>

            <button type="submit" id="submitBtn" class="contact-btn">Log in</button>
        </form>

        <p id="authMessage" class="msg"></p>

        <p class="toggle">
            <span id="toggleText">New here?</span>
            <a href="#" id="toggleLink">Create an account</a>
        </p>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
