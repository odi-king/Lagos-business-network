<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Lagos Business Network</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#0b1220">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LBN">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

<nav class="nav">
    <div class="container">
        <a href="index.html" class="logo"><span class="logo-mark">LBN</span><span class="logo-name">Lagos Business Network</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </div>
</nav>

<main class="container auth-wrap">
    <section class="panel">
        <h2 id="authTitle">Log in</h2>

        <form id="authForm">
            <div id="signupFields" style="display:none; flex-direction:column; gap:10px;">
                <input type="text" id="fullName" placeholder="Full name" autocomplete="name">
                <div class="role-picker">
                    <div class="role-title">I am a...</div>
                    <button type="button" class="role-card selected" data-role="student" aria-pressed="true">
                        <span class="role-head"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg> Student or Graduate</span>
                        <span class="role-text">Learn skills, find opportunities, showcase talent and connect with businesses.</span>
                    </button>
                    <button type="button" class="role-card" data-role="lecturer" aria-pressed="false">
                        <span class="role-head"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="12" rx="2"/><path d="M12 15v3M8 21l4-3 4 3"/></svg> Lecturer or Instructor</span>
                        <span class="role-text">Teach courses, share knowledge and sell handouts.</span>
                    </button>
                    <button type="button" class="role-card" data-role="business" aria-pressed="false">
                        <span class="role-head"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V6l7-3v18M11 21h9V10l-9-3M7 9h1M7 13h1M7 17h1M15 13h1M15 17h1"/></svg> Business Owner or Company</span>
                        <span class="role-text">Promote businesses, sell products and services, and discover talent.</span>
                    </button>
                </div>
                <select id="role" style="display:none;">
                    <option value="student">Student or graduate</option>
                    <option value="lecturer">Lecturer or instructor</option>
                    <option value="business">Business owner or company</option>
                </select>
                <input type="text" id="institution" placeholder="Your school or university" autocomplete="organization" style="display:none;">
                <p id="lecturerNote" class="meta" style="display:none; margin:0;">We check every lecturer with their school before approving the account.</p>
            </div>

            <input type="email" id="email" placeholder="Email address" autocomplete="email" required>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>

            <button type="submit" id="submitBtn" class="contact-btn">Log in</button>
        </form>

        <p id="authMessage" class="msg"></p>

        <p class="toggle">
            <span id="toggleText">New here?</span>
            <a href="#" id="toggleLink">Create an account</a>
        </p>
        <p class="toggle" id="forgotWrap">
            <a href="#" id="forgotLink">Forgot password?</a>
        </p>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="pwa.js"></script>
</body>
</html>
