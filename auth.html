<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Lagos Business Network</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#0b1220">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LBN">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

<nav class="nav">
    <div class="container">
        <a href="index.html" class="logo"><span class="logo-mark">LBN</span><span class="logo-name">Lagos Business Network</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </div>
</nav>

<main class="container auth-wrap">
    <section class="panel">
        <h2 id="authTitle">Log in</h2>

        <form id="authForm">
            <div id="signupFields" style="display:none; flex-direction:column; gap:10px;">
                <input type="text" id="fullName" placeholder="Full name" autocomplete="name">
                <select id="role">
                    <option value="student">I am a student or graduate</option>
                    <option value="lecturer">I am a lecturer</option>
                </select>
                <input type="text" id="institution" placeholder="Your school or university" autocomplete="organization" style="display:none;">
                <p id="lecturerNote" class="meta" style="display:none; margin:0;">We check every lecturer with their school before approving the account.</p>
            </div>

            <input type="email" id="email" placeholder="Email address" autocomplete="email" required>
            <input type="password" id="password" placeholder="Password (at least 8 characters)" minlength="8" autocomplete="current-password" required>

            <button type="submit" id="submitBtn" class="contact-btn">Log in</button>
        </form>

        <p id="authMessage" class="msg"></p>

        <p class="toggle">
            <span id="toggleText">New here?</span>
            <a href="#" id="toggleLink">Create an account</a>
        </p>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="pwa.js"></script>
</body>
</html>
