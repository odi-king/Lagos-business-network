<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#0b1220">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LBN">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

<nav class="nav">
    <div class="container">
        <a href="index.html" class="logo"><span class="logo-mark">LBN</span><span class="logo-name">Lagos Business Network</span></a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="classes.html">Classes</a>
            <a href="feed.html">Marketplace</a>
            <a href="reels.html">Reels</a>
            <a href="trades.html">My trades</a>
            <a href="member.html" class="active">Profile</a>
            <a href="#" id="logoutBtn">Log out</a>
        </div>
    </div>
</nav>

<main class="container">
    <section id="profileBox" class="profile"><p class="meta">Loading...</p></section>

    <section id="editPanel" class="panel" style="display:none;">
        <h2>Edit profile</h2>
        <form id="editForm">
            <input type="text" id="editName" placeholder="Your name" maxlength="60" required>
            <textarea id="editBio" placeholder="Tell people what you sell, make or teach (200 characters)" maxlength="200"></textarea>
            <label class="file-label">Profile photo
                <input type="file" id="editPhoto" accept="image/*">
            </label>
            <label class="check-label"><input type="checkbox" id="editRemovePhoto"> Remove my current photo</label>
            <button type="submit" id="editSave" class="contact-btn">Save changes</button>
            <button type="button" id="editCancel" class="btn btn-outline">Cancel</button>
        </form>
        <p id="editNote" class="msg"></p>
    </section>

    <div id="profileMenu"></div>

    <div class="profile-tabs" id="profileTabs" style="display:none;">
        <button type="button" class="ptab active" data-tab="posts" aria-label="Posts"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
        <button type="button" class="ptab" data-tab="reels" aria-label="Reels"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/></svg><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="ptab" data-tab="reposts" aria-label="Reposts"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
        <button type="button" class="ptab" data-tab="tagged" aria-label="Tagged"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19a6 6 0 0 1 11 0"/></svg></button>
    </div>
    <div class="chips" id="reelsSort" style="display:none;">
        <button type="button" class="chip active" data-sort="latest">Latest</button>
        <button type="button" class="chip" data-sort="popular">Most viewed</button>
    </div>
    <div id="memberPosts" class="profile-grid"></div>
    <p id="memberNote" class="meta"></p>
    <button type="button" id="memberMore" class="btn btn-outline" style="display:none; margin-top:14px;">Load more</button>
</main>

<div id="sheet" class="sheet" style="display:none;">
    <div class="sheet-card">
        <div class="sheet-head"><strong id="sheetTitle"></strong><button type="button" id="sheetClose" class="plain-btn">Close</button></div>
        <div id="sheetBody"></div>
    </div>
</div>
