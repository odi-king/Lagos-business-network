<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile - Lagos Business Network</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#0b1220">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LBN">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

<nav class="nav">
    <div class="container">
        <a href="index.html" class="logo"><span class="logo-mark">LBN</span><span class="logo-name">Lagos Business Network</span></a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="classes.html">Classes</a>
            <a href="feed.html">Marketplace</a>
            <a href="reels.html">Reels</a>
            <a href="trades.html">My trades</a>
            <a href="member.html" class="active">Profile</a>
            <a href="#" id="logoutBtn">Log out</a>
        </div>
    </div>
</nav>

<main class="container">
    <section id="profileBox" class="profile"><p class="meta">Loading...</p></section>

    <section id="editPanel" class="panel" style="display:none;">
        <h2>Edit profile</h2>
        <form id="editForm">
            <input type="text" id="editName" placeholder="Your name" maxlength="60" required>
            <textarea id="editBio" placeholder="Tell people what you sell, make or teach (200 characters)" maxlength="200"></textarea>
            <label class="file-label">Profile photo
                <input type="file" id="editPhoto" accept="image/*">
            </label>
            <label class="check-label"><input type="checkbox" id="editRemovePhoto"> Remove my current photo</label>
            <button type="submit" id="editSave" class="contact-btn">Save changes</button>
            <button type="button" id="editCancel" class="btn btn-outline">Cancel</button>
        </form>
        <p id="editNote" class="msg"></p>
    </section>

    <div id="profileMenu"></div>

    <div id="memberPosts"></div>
    <p id="memberNote" class="meta"></p>
    <button type="button" id="memberMore" class="btn btn-outline" style="display:none; margin-top:14px;">Load more</button>
</main>

<div id="sheet" class="sheet" style="display:none;">
    <div class="sheet-card">
        <div class="sheet-head"><strong id="sheetTitle"></strong><button type="button" id="sheetClose" class="plain-btn">Close</button></div>
        <div id="sheetBody"></div>
    </div>
</div>

<footer class="footer">
    <div class="container">&copy; 2026 Lagos Business Network &bull; <a href="help.html" style="color: var(--accent);">Help</a> &bull; <a href="contact.html" style="color: var(--accent);">Contact us</a></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="membership.js"></script>
<script src="badges.js"></script>
<script src="video-utils.js"></script>
<script src="posts.js"></script>
<script src="member.js"></script>
<script src="appnav.js"></script>
<script src="pwa.js"></script>
</body>
</html>
