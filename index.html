<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lagos Business Network</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <h1>Lagos Business Network</h1>
        <p>Discover, register and connect with businesses across Lagos.</p>
        <button type="button" id="exploreBtn" class="contact-btn">Explore</button>
    </header>

    <main>
        <section class="panel">
            <h2>Register Your Business</h2>
            <form id="businessForm">
                <input type="text" id="businessName" placeholder="Business name" required>

                <select id="businessCategory" required>
                    <option value="" disabled selected>Select category</option>
                    <option value="Food">Food</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Tech">Tech</option>
                    <option value="Services">Services</option>
                    <option value="Other">Other</option>
                </select>

                <input type="text" id="businessLocation" placeholder="Location (e.g. Ikeja)" required>
                <input type="tel" id="businessPhone" placeholder="Phone number" required>
                <input type="email" id="businessEmail" placeholder="Email address" required>

                <button type="submit" class="contact-btn">Register Business</button>
            </form>
        </section>

        <section class="panel">
            <h2>Find a Business</h2>
            <div class="filters">
                <input type="text" id="searchInput" placeholder="Search by name...">
                <select id="categoryFilter">
                    <option value="all">All</option>
                    <option value="Food">Food</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Tech">Tech</option>
                    <option value="Services">Services</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div id="registeredBusinessList"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
