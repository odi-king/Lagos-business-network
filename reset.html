<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New password - Lagos Business Network</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#0b1220">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LBN">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

<nav class="nav">
    <div class="container">
        <a href="index.html" class="logo"><span class="logo-mark">LBN</span><span class="logo-name">Lagos Business Network</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </div>
</nav>

<main class="container auth-wrap">
    <section class="panel">
        <h2>Set a new password</h2>

        <form id="resetForm">
            <input type="password" id="newPassword" placeholder="New password (at least 8 characters)" minlength="8" autocomplete="new-password" required>
            <input type="password" id="confirmPassword" placeholder="Type it again" minlength="8" autocomplete="new-password" required>
            <button type="submit" id="saveBtn" class="contact-btn">Save new password</button>
        </form>

        <p id="resetMessage" class="msg"></p>

        <p class="toggle"><a href="auth.html">Back to log in</a></p>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="reset.js"></script>
<script src="pwa.js"></script>
</body>
</html>
